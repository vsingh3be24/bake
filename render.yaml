services:
  - type: web
    name: lhh-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: OWNER_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: SHOP_TIMEZONE
        value: Asia/Kolkata
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # Client — a static site on Render instead of Vercel. VITE_* vars are
  # baked in at build time, so unlike the API's env vars these can't be
  # changed after deploy without a rebuild.
  - type: web
    name: lhh-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Fill in once lhh-api has a live URL (chicken-and-egg with CLIENT_URL
      # below — deploy the API first, then come back and set both).
      - key: VITE_API_URL
        sync: false
      - key: VITE_WHATSAPP
        sync: false
    routes:
      # BrowserRouter needs this — without it, refreshing on e.g. /menu/cakes
      # 404s instead of loading the SPA and letting React Router take over.
      - type: rewrite
        source: /*
        destination: /index.html
